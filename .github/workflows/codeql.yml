name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    # Use ubuntu-latest for the analysis job

    name: CodeQL Analysis
    runs-on: ubuntu-latest

    # Define permissions for the job

    permissions:
      actions: read
      contents: read
      security-events: write

    # Define language to be analyzed

    strategy:
      fail-fast: false
      matrix:
        language: [ go ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

    # Define steps to build and run the Docker container

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze


    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Build Docker image
      run: docker build -t go-web-server .

    - name: Run Docker container
      run: docker run -d --name go-web-server-test -p 8080:8080 go-web-server

    - name: Test readfile endpoint
      run: |
        for i in {1..30}; do
          if curl --fail http://localhost:8080/readfile?file=hello.txt; then
            exit 0
          fi
          sleep 2
        done
        echo "Endpoint test failed"
        docker logs go-web-server-test
        exit 1

    - name: Stop and remove container
      if: always()
      run: docker rm -f go-web-server-test || true
